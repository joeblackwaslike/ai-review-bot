<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="640" height="420" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="24" y="26" font-size="16" font-weight="600" fill="#0b0b0b">Review cost by PR complexity</text>
  <text x="24" y="46" font-size="12" fill="#52514e">$/review · range is min&#8211;max, tick is median · n=78 normal, n=117 complex</text>

  <!-- Gridlines + y-axis labels -->
  <g stroke="#e5e4e0" stroke-width="1">
    <line x1="80" y1="360" x2="600" y2="360"/>
    <line x1="80" y1="286" x2="600" y2="286"/>
    <line x1="80" y1="212" x2="600" y2="212"/>
    <line x1="80" y1="138" x2="600" y2="138"/>
    <line x1="80" y1="64"  x2="600" y2="64"/>
  </g>
  <g font-size="11" fill="#52514e" text-anchor="end">
    <text x="72" y="364">$0.00</text>
    <text x="72" y="290">$0.50</text>
    <text x="72" y="216">$1.00</text>
    <text x="72" y="142">$1.50</text>
    <text x="72" y="68">$2.00</text>
  </g>

  <!-- Trivial: no data -->
  <g>
    <rect x="133" y="348" width="24" height="12" rx="3" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="145" y="330" font-size="11" fill="#52514e" text-anchor="middle">no data</text>
    <text x="145" y="392" font-size="12" fill="#0b0b0b" text-anchor="middle">Trivial</text>
  </g>

  <!-- Normal: min .0327 / median .1531 / max .9519 -->
  <g>
    <rect x="263" y="219.1" width="24" height="136.1" rx="4" fill="#2a78d6"/>
    <line x1="259" y1="337.3" x2="291" y2="337.3" stroke="#fcfcfb" stroke-width="3"/>
    <text x="300" y="341" font-size="12" font-weight="600" fill="#0b0b0b">$0.15</text>
    <text x="275" y="392" font-size="12" fill="#0b0b0b" text-anchor="middle">Normal</text>
    <text x="275" y="406" font-size="10" fill="#52514e" text-anchor="middle">n=78</text>
  </g>

  <!-- Complex: min .0496 / median .4365 / max 1.8070 -->
  <g>
    <rect x="393" y="92.6" width="24" height="260.1" rx="4" fill="#2a78d6"/>
    <line x1="389" y1="295.4" x2="421" y2="295.4" stroke="#fcfcfb" stroke-width="3"/>
    <text x="430" y="299" font-size="12" font-weight="600" fill="#0b0b0b">$0.44</text>
    <text x="405" y="392" font-size="12" fill="#0b0b0b" text-anchor="middle">Complex</text>
    <text x="405" y="406" font-size="10" fill="#52514e" text-anchor="middle">n=117</text>
  </g>

  <!-- Deep: no data -->
  <g>
    <rect x="523" y="348" width="24" height="12" rx="3" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="535" y="330" font-size="11" fill="#52514e" text-anchor="middle">no data</text>
    <text x="535" y="392" font-size="12" fill="#0b0b0b" text-anchor="middle">Deep</text>
  </g>
</svg>
